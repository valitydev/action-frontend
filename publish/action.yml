name: "Publish to NPM"
description: "Publish to NPM"

inputs:
  npm-skip-version-up:
    description: Skip version up
    default: "false"
    required: false
  directory:
    description: Directory
    default: "./"
    required: false
  pr-label:
    description: PR label for publish (publish or publish {label})
    default: ""
    required: false

runs:
  using: composite
  steps:
    - name: Publish
      if: >
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'publish')
        || (inputs.pr-label != '' && contains(github.event.pull_request.labels.*.name, format('publish {0}', inputs.pr-label)))
      working-directory: ${{ inputs.directory }}
      run: |
        if [ "${NPM_SKIP_VERSION_UP}" == "false" ]; then
          TIMESTAMP="$(date -u +%Y%m%d%H%M%S)"
          if [ "${GITHUB_EVENT_NAME}" == "pull_request" ]; then
            SHA_SHORT="${PR_HEAD_SHA::7}"
            SUFFIX="pr${PR_NUMBER}.${TIMESTAMP}.${SHA_SHORT}"
          else
            SHA_SHORT="${GITHUB_SHA::7}"
            SUFFIX="r.${TIMESTAMP}.${SHA_SHORT}"
          fi

          BASE_VERSION="$(npm version patch --no-git-tag-version)"
          npm version "${BASE_VERSION#v}-${SUFFIX}" --no-git-tag-version
        fi

        npm publish --tag ${{ github.event_name == 'pull_request' && 'pr' || 'latest' }}
      shell: bash
      env:
        NPM_SKIP_VERSION_UP: ${{ inputs.npm-skip-version-up }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_NUMBER: ${{ github.event.number }}
